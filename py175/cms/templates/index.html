{% extends "layout.html" %}
{% block contents %}
    <ul>
        {% for file in files %}
            <li>
                <a href="{{ url_for('open_file', filename=file) }}">{{ file }}</a>&nbsp
                <a href="{{ url_for('edit_file', filename=file) }}">Edit</a>
                <form class="inline" action="{{ url_for('delete', filename=file) }}" method="post">
                    <button type="submit">Delete</button>
                </form>
            </li>
        {% endfor %}
    </ul>
    <p><a href="{{ url_for('new_doc') }}">New Document</a></p>
{% endblock %}
